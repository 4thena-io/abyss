# Public address used to reach this instance (e.g. behind a reverse proxy).
# Used to build webhook URLs. Falls back to http://<server.host>:<server.port> if unset.
root_url: "https://abyss.example.com"

server:
  host: 0.0.0.0
  port: 8000

database:
  type: sqlite
  path: ./abyss.db

forge:
  type: gitea
  host: http://127.0.0.1:3000
  branch: "main"
  token: ""
  owner: ""

ci:
  type: gitea-actions

auth:
  client_id: ""
  client_secret: ""
  callback_url: "http://localhost:8000/auth/callback"

logging:
  level: info
  format: pretty
  file: ""
