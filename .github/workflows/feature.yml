name: feature

on:
  push:
    branches:
      - "feat/**"

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install UI dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build UI
        working-directory: frontend
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-binary:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Vendor Go modules
        run: go mod vendor

      - name: Build binary
        run: go build -ldflags="-s -w" -o build/abyss .
