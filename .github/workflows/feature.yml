name: feature

on:
  push:
    branches:
      - "feat/**"

jobs:
  build-ui:
    runs-on: self-hosted
    container:
      image: oven/bun:1.3.3-alpine
    steps:
      - uses: actions/checkout@v4

      - name: Install UI dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build UI
        working-directory: frontend
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-binary:
    needs: build-ui
    runs-on: self-hosted
    container:
      image: golang:1.26.2-alpine3.22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Vendor Go modules
        run: go mod vendor

      - name: Build binary
        run: go build -ldflags="-s -w" -o build/abyss .
