name: release

on:
  push:
    tags:
      - "*"

jobs:
  build-ui:
    runs-on: self-hosted
    container:
      image: oven/bun:1.3.3-alpine
    steps:
      - uses: actions/checkout@v4

      - name: Install UI dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build UI
        working-directory: frontend
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-binary:
    needs: build-ui
    runs-on: self-hosted
    container:
      image: golang:1.26.2-alpine3.22
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Vendor Go modules
        run: go mod vendor

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -ldflags="-s -w" -o build/abyss-linux-${{ matrix.arch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: abyss-linux-${{ matrix.arch }}
          path: build/abyss-linux-${{ matrix.arch }}

  build-docker:
    needs: build-binary
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: abyss-linux-amd64
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: abyss-linux-arm64
          path: build

      - name: Make binaries executable
        run: chmod +x build/abyss-linux-amd64 build/abyss-linux-arm64

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: git.internal.4thena.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            git.internal.4thena.io/${{ github.repository }}:${{ github.ref_name }}
            git.internal.4thena.io/${{ github.repository }}:latest
