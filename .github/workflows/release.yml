name: release

on:
  push:
    tags:
      - "*"

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install UI dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build UI
        working-directory: frontend
        run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  build-binary:
    needs: build-ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Vendor Go modules
        run: go mod vendor

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -ldflags="-s -w" -o build/abyss-linux-${{ matrix.arch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: abyss-linux-${{ matrix.arch }}
          path: build/abyss-linux-${{ matrix.arch }}

  build-docker:
    needs: build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: abyss-linux-amd64
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: abyss-linux-arm64
          path: build

      - name: Make binaries executable
        run: chmod +x build/abyss-linux-amd64 build/abyss-linux-arm64

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
