when:
  event: tag

steps:
  build-frontend:
    image: oven/bun:1.3.3-alpine
    directory: frontend/
    commands:
      - bun install
      - bun run build

  build-binary:
    depends_on:
      - build-frontend
    image: ghcr.io/techknowlogick/xgo:latest
    commands:
      - mkdir -p build
      - xgo -v -x -targets 'linux/amd64,linux/arm64' -dest build -out app -pkg cmd/api .
      - ls -la /build 

