when:
  event: tag

steps:
  build-frontend:
    image: oven/bun:1.3.3-alpine
    directory: frontend/
    commands:
      - bun install
      - bun run build

  vendor:
    image: golang:1.24.4-alpine3.22
    commands:
      - go mod vendor

  build-linux-amd64:
    image: golang:1.24.4-alpine3.22 
    depends_on: build-frontend
    commands:
      - apk add zig
      - CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" CXX="zig c++ -target x86_64-linux-musl" go build -tags "sqlite_omit_load_extension" -ldflags="-s -w -linkmode external -extldflags '-static'" -o build/abyss-linux-amd64 ./cmd/api
      - ls -la build
  
  build-linux-arm64:
    image: golang:1.24.4-alpine3.22
    depends_on: build-frontend
    commands:
      - apk add zig
      - CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-musl" CXX="zig c++ -target aarch64-linux-musl" go build -tags "sqlite_omit_load_extension" -ldflags="-s -w -linkmode external -extldflags '-static'" -o build/abyss-linux-arm64 ./cmd/api
      - ls -la build

  build-docker:
    depends_on:
      - build-linux-amd64
      - build-linux-arm64
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      registry: git.4thena.io
      repo: "git.4thena.io/${CI_REPO}"
      platforms: linux/amd64,linux/arm64/v8
      tags: "${CI_COMMIT_TAG},latest"
      dockerfile: Containerfile
      username:
        from_secret: GITEA_USERNAME
      password:
        from_secret: GITEA_ACCESS_TOKEN
