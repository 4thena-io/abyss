when:
  event: tag

steps:
  build-frontend:
    image: oven/bun:1.3.3-alpine
    directory: frontend/
    commands:
      - bun install
      - bun run build

  build-binary:
    depends_on:
      - build-frontend
    image: ghcr.io/techknowlogick/xgo:latest
    commands:
      - apt update
      - apt install tree
      - mkdir -p build
      - xgo -targets 'linux/arm64' -dest build -tags 'sqlite' -out abyss -pkg cmd/api .
      - xgo -targets 'linux/amd64' -dest build -tags 'sqlite' -out abyss -pkg cmd/api .
      - mv /build/abyss* ./build
      - tree ./build

  build-docker:
    depends_on:
      - build-binary
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      registry: git.4thena.io
      repo: "git.4thena.io/${CI_REPO}"
      platforms: linux/amd64,linux/arm64/v8
      tags: "${CI_COMMIT_TAG},latest"
      dockerfile: Containerfile
      username:
        from_secret: GITEA_USERNAME
      password:
        from_secret: GITEA_ACCESS_TOKEN
