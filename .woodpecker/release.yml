when:
  event: push
  branch: main
  path:
    include: ['cmd/*', 'internal/*', 'frontend/*']
    exclude: ['*.md']

variables:
  - &golang-image 'golang:1.24.4-alpine3.22'
  - &bun-image 'oven/bun:1.3.3-alpine'

steps:
  build-frontend:
    image: *bun-image
    directory: frontend/
    commands:
      - bun install
      - bun run build

  vendor:
    image: *golang-image
    commands:
      - go mod vendor

  build-binary:
    image: *golang-image
    environment:
      CGO: 0
      GOOS: linux
    depends_on:
      - build-frontend
      - vendor
    commands:
      - GOARCH=amd64 go build -ldflags="-s -w" -o build/abyss-linux-amd64 ./cmd/api
      - GOARCH=arm64 go build -ldflags="-s -w" -o build/abyss-linux-arm64 ./cmd/api
  
  build-docker:
    depends_on:
      - build-binary 
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      registry: git.4thena.io
      repo: "git.4thena.io/${CI_REPO}"
      platforms: linux/amd64,linux/arm64/v8
      tags: "${CI_COMMIT_TAG},latest"
      dockerfile: Containerfile
      username:
        from_secret: GITEA_USERNAME
      password:
        from_secret: GITEA_ACCESS_TOKEN
