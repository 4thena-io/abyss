server:
  host: 0.0.0.0
  port: 8000

database:
  type: sqlite
  path: ./abyss.db

forge:
  type: gitea
  host: http://127.0.0.1:3000
  token: ""
  owner: ""

ci:
  type: gitea-actions

auth:
  client_id: ""
  client_secret: ""
  callback_url: "http://localhost:8000/auth/callback"

logging:
  level: info       # debug, info, warn, error
  format: pretty    # pretty or json
  file: ""          # optional log file path, always written as JSON
